name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: Compilar (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Compilar
        run: mvn -B -DskipTests clean compile

  empaquetar:
    name: Empaquetar igual que el deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: compilar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build identico al de Railway
        run: mvn -DoutputFile=target/mvn-dependency-list.log -B -DskipTests clean dependency:list install -Pproduction

  tests:
    name: Tests (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: compilar
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Ejecutar tests
        run: mvn -B test
