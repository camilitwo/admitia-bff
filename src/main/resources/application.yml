server:
  port: ${PORT:8080}

spring:
  application:
    name: admitia-bff
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES}
    refresh-token-minutes: ${APP_JWT_REFRESH_MINUTES}
    issuer: ${APP_JWT_ISSUER}
    audience: ${APP_JWT_AUDIENCE}
    clock-skew-seconds: ${APP_JWT_CLOCK_SKEW}
  firebase:
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON}
    expected-project-id: ${APP_FIREBASE_EXPECTED_PROJECT_ID:admitia-55514}
    allowed-providers: ${APP_FIREBASE_ALLOWED_PROVIDERS}
    max-auth-age-seconds: ${APP_FIREBASE_MAX_AUTH_AGE_SECONDS}
    check-revoked: ${APP_FIREBASE_CHECK_REVOKED}
    verification:
      # URL pública del BFF que se usa para reescribir el link de verificación de email
      # y camuflar el dominio firebaseapp.com en el correo institucional.
      # Sólo se cambia el host visible: el oobCode dinámico generado por Firebase viaja
      # intacto y la verificación se sigue marcando en Firebase Auth (emailVerified=true).
      # Ej: https://api.admitia.cl  (sin slash final)
      public-base-url: ${APP_FIREBASE_VERIFICATION_PUBLIC_BASE_URL:https://admitia-nginx-staging.up.railway.app}
      # Path público (después del host) que el gateway/nginx enruta al BFF.
      # Por defecto /v1/auth/firebase/verify-redirect (NGINX reescribe /v1 → /api).
      # Si NGINX algún día expone el endpoint en otra ruta, override por env.
      public-path: ${APP_FIREBASE_VERIFICATION_PUBLIC_PATH:/v1/auth/firebase/verify-redirect}
      # URL del front a la que Firebase redirige tras verificar (ActionCodeSettings.continueUrl).
      # Opcional. Si no se configura, Firebase muestra su pantalla por defecto al verificar.
      # Ej: https://admitia.cl/apoderado/email-verificado
      continue-url: ${APP_FIREBASE_VERIFICATION_CONTINUE_URL:}
  cookies:
    secure: ${APP_COOKIES_SECURE}
    same-site: ${APP_COOKIES_SAME_SITE}
  csrf:
    enabled: false
  uploads-dir: ${APP_UPLOADS_DIR:uploads}
  blob:
    token: ${BLOB_READ_WRITE_TOKEN:}
  email:
    mock-mode: ${APP_EMAIL_MOCK_MODE:false}
    # Remitente obligatorio. Debe ser un dominio verificado en Resend.
    from: ${APP_EMAIL_FROM}
    resend:
      api-key: ${RESEND_API_KEY}
      base-url: ${RESEND_BASE_URL}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  # URL base para redirecciones (debe ser la URL pública del frontend)
  # URL del frontend: https://admisiones.dev.admitia.dedyn.io/#/
  # En staging/prod: configurar via APP_FRONTEND_BASE_URL en Railway
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:https://admisiones.dev.admitia.dedyn.io}
  temporary-password:
    validity-hours: ${APP_TEMPORARY_PASSWORD_VALIDITY_HOURS:24}
    reset-cooldown-seconds: ${APP_TEMPORARY_PASSWORD_RESET_COOLDOWN_SECONDS:60}
  # URL base pública del BFF (para URLs de confirmación de entrevistas)
  # NOTA: Como el BFF no está expuesto públicamente, esta URL debe ser la del NGINX
  # que expone el endpoint /api/public/interview/confirm y lo reenvía al BFF
  # En dev: https://admisiones.dev.admitia.dedyn.io (misma URL que el frontend)
  # En staging/prod: configurar via APP_BFF_PUBLIC_BASE_URL en Railway
  bff:
    public-base-url: ${APP_BFF_PUBLIC_BASE_URL:https://admisiones.dev.admitia.dedyn.io}
  # Configuración de confirmación de entrevistas vía email (patrón pasarela)
  confirmation:
    # Usa APP_FRONTEND_BASE_URL (misma que VITE_API_BASE_URL en frontend)
    # Ruta donde se muestra el resultado de confirmación
    # NOTA: NO incluir /#/ aquí — los HTTP 302 no preservan fragmentos.
    # El frontend se encarga de redirigir al HashRouter.
    result-path: /interview/confirmation-result
    # Expiración del token en horas (7 días por defecto)
    token-expiry-hours: ${APP_CONFIRMATION_TOKEN_EXPIRY_HOURS:168}
  
  # Email de admisiones para notificaciones de confirmación/rechazo de entrevistas
  admissions:
    email: ${APP_ADMISSIONS_EMAIL:camilo.igv@gmail.com}
  integrations:
    mtn-admission:
      enabled: ${MTN_ADMISSION_ENABLED:false}
      base-url: ${MTN_ADMISSION_BASE_URL:}
      token-path: ${MTN_ADMISSION_TOKEN_PATH:/auth/token}
      guardians-path: ${MTN_ADMISSION_GUARDIANS_PATH:/admision/apoderados}
      charges-path: ${MTN_ADMISSION_CHARGES_PATH:/admision/cobros}
      client-code: ${MTN_ADMISSION_CLIENT_CODE:ADMISION}
      # Obligatorio en Railway. Nunca almacenar el secreto ni un Bearer temporal en este archivo.
      client-secret: ${MTN_ADMISSION_CLIENT_SECRET}
      client-auth-method: ${MTN_ADMISSION_CLIENT_AUTH_METHOD:BASIC}
      allow-insecure-http: ${MTN_ADMISSION_ALLOW_INSECURE_HTTP:false}
      connect-timeout: ${MTN_ADMISSION_CONNECT_TIMEOUT:3s}
      read-timeout: ${MTN_ADMISSION_READ_TIMEOUT:10s}
      application-fee: ${MTN_ADMISSION_APPLICATION_FEE:0}
      currency: ${MTN_ADMISSION_CURRENCY:CLP}
      due-days: ${MTN_ADMISSION_DUE_DAYS:3}
      reference-prefix: ${MTN_ADMISSION_REFERENCE_PREFIX:ADMITIA}
      default-city: ${MTN_ADMISSION_DEFAULT_CITY:Santiago}
      provider-zone: ${MTN_ADMISSION_PROVIDER_ZONE:America/Santiago}

management:
  endpoints:
    web:
      exposure:
        include: health,info


logging:
  level:
    root: INFO
    cl.mtn.admitiabff: INFO
